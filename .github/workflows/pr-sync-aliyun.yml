name: Sync plugins to Aliyun Codeup

on:
  pull_request:
    paths:
      - "plugins.json"

jobs:
  detect-and-sync:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出 PR 分支代码
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      # 2. 拉取 base 仓库对应分支
      - name: Fetch base branch
        run: |
          git remote add upstream https://github.com/${{ github.repository }}.git
          git fetch upstream ${{ github.base_ref }} --depth=1

      # 3. 检测插件变更
      - name: Identify changed plugins
        id: changed-plugins
        shell: python
        run: |
          import json
          import os
          import subprocess

          # 当前（PR 分支）的 plugins.json
          try:
              with open('plugins.json', 'r', encoding='utf-8') as f:
                  current_plugins = json.load(f)
          except FileNotFoundError:
              current_plugins = []
              print("::warning::plugins.json not found in PR branch")

          # 获取 base 分支的 plugins.json
          base_plugins = []
          try:
              result = subprocess.run(['git', 'show', f'upstream/${{ github.base_ref }}:plugins.json'], 
                                     capture_output=True, text=True, encoding='utf-8')
              if result.returncode == 0:
                  base_plugins = json.loads(result.stdout)
          except (FileNotFoundError, json.JSONDecodeError):
              print("::warning::Base plugins.json not found or invalid")

          # 变更检测
          changed = []
          base_map = {p.get('github_url'): p for p in base_plugins}
          for plugin in current_plugins:
              github_url = plugin.get('github_url')
              if not github_url:
                  continue
              base_plugin = base_map.get(github_url)
              if not base_plugin or json.dumps(plugin, sort_keys=True) != json.dumps(base_plugin, sort_keys=True):
                  repo_name = github_url.split('/')[-1]
                  if repo_name.endswith('.git'):
                      repo_name = repo_name[:-4]
                  changed.append({
                      'name': plugin.get('name', ''),
                      'github_url': github_url,
                      'repo_name': repo_name,
                      'current_data': plugin
                  })

          if changed:
              print(f"Changed plugins: {json.dumps(changed, ensure_ascii=False)}")
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
                  f.write(f'changed_plugins={json.dumps(changed, ensure_ascii=False)}\n')
          else:
              print("No changed plugins found")

      # 4. 安装 Python 依赖
      - name: Install Python dependencies
        if: ${{ steps.changed-plugins.outputs.changed_plugins != '' }}
        run: |
          pip install alibabacloud_devops20210625 alibabacloud_credentials

      # 5. 同步到阿里云 Codeup
      - name: Sync to Aliyun Codeup
        if: steps.changed-plugins.outputs.changed_plugins != ''
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global http.postBuffer 524288000

      # 6. 处理变更插件（使用阿里云 SDK 创建仓库）
      - name: Process each changed plugin
        id: process-plugins
        shell: python
        if: ${{ steps.changed-plugins.outputs.changed_plugins != '' }}
        env:
          CHANGED_PLUGINS: ${{ steps.changed-plugins.outputs.changed_plugins }}
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_ACCESS_TOKEN: ${{ secrets.ALIYUN_ACCESS_TOKEN }}
          ALIYUN_ACCOUNT: ${{ secrets.ALIYUN_ACCOUNT }}
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_PASSWORD }}
          ALIYUN_ORG_ID: '67a361cf556e6cdab537117a'
          ALIYUN_GROUP_PATH: 'zhenxun_plugins'
        run: |
          import json
          import os
          import subprocess
          import sys
          from typing import List
          from alibabacloud_devops20210625.client import Client as devops20210625Client
          from alibabacloud_credentials.client import Client as CredentialClient
          from alibabacloud_credentials import models as credential_models
          from alibabacloud_tea_openapi import models as open_api_models
          from alibabacloud_devops20210625 import models as devops_20210625_models
          from alibabacloud_tea_util import models as util_models
          from alibabacloud_tea_util.client import Client as UtilClient
          def get_credentials():
            """通过阿里云凭证提供链获取凭证"""
            config = credential_models.Config(
                type="access_key",  # 明确指定凭证类型
                access_key_id=os.environ.get('ALIBABA_CLOUD_ACCESS_KEY_ID'),
                access_key_secret=os.environ.get('ALIBABA_CLOUD_ACCESS_KEY_SECRET')
            )
            return CredentialClient(config)
          # 阿里云 SDK 客户端初始化函数
          def get_client() -> devops20210625Client:
            credentials = get_credentials()
            config = open_api_models.Config(
                credential=credentials,
                endpoint="devops.cn-hangzhou.aliyuncs.com",
                region_id="cn-hangzhou",
            )
            return devops20210625Client(config)


          # 创建仓库函数
          def create_repository(client, org_id, repo_name):
              request = devops_20210625_models.CreateRepositoryRequest(
                  namespace_id=1638483,
                  name=repo_name,
                  visibility_level=10,
                  organization_id=org_id,
              )
              runtime = util_models.RuntimeOptions()
              headers = {}
              try:
                  response = client.create_repository_with_options(request, headers, runtime)
                  print(f"✅ Created repository: {repo_name}")
                  return True
              except Exception as error:
                  # 处理仓库已存在的情况
                  if "Repository already exists" in str(error):
                      print(f"ℹ️ Repository {repo_name} already exists")
                      return True
                  print(f"❌ Failed to create repository {repo_name}: {str(error)}")
                  return False

          # 主处理逻辑
          changed_plugins = json.loads(os.environ['CHANGED_PLUGINS'])
          results = []
          access_token = os.environ['ALIYUN_ACCESS_TOKEN']
          org_id = os.environ['ALIYUN_ORG_ID']
          group_path = os.environ['ALIYUN_GROUP_PATH']
          aliyun_account = os.environ['ALIYUN_ACCOUNT']
          aliyun_password = os.environ['ALIYUN_PASSWORD']
          # 初始化阿里云客户端
          aliyun_client = get_client()

          for plugin in changed_plugins:
              github_url = plugin['github_url']
              repo_name = plugin['repo_name']
              
              # 创建阿里云认证 URL（用于 git 操作）
              auth_url = f"https://{aliyun_account}:{aliyun_password}@codeup.aliyun.com/{org_id}/{group_path}/{repo_name}.git"
              display_url = f"https://{aliyun_account}:****@codeup.aliyun.com/{org_id}/{group_path}/{repo_name}.git"

              try:
                  # 1. 创建阿里云仓库（如果不存在）
                  if not create_repository(aliyun_client, org_id, repo_name):
                      raise Exception(f"Repository creation failed: {repo_name}")
                  
                  # 2. 克隆 GitHub 仓库
                  subprocess.run(['git', 'clone', '--depth=1', github_url, repo_name], check=True)
                  os.chdir(repo_name)
                  
                  # 3. 添加阿里云远程
                  subprocess.run(['git', 'remote', 'add', 'aliup', auth_url], check=True)
                  
                  # 4. 强制推送到阿里云
                  subprocess.run(['git', 'push', 'aliup', 'HEAD:main', '--force'], check=True)

                  os.chdir('..')
                  results.append({
                      'github_url': github_url,
                      'aliurl': display_url,
                      'status': 'success'
                  })
                  print(f"✅ Successfully synced {repo_name} to Aliyun Codeup")

              except Exception as e:
                  print(f"❌ Failed to sync {repo_name}: {str(e)}")
                  results.append({
                      'github_url': github_url,
                      'status': 'failed',
                      'error': str(e)
                  })

          # 输出处理结果
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'results={json.dumps(results, ensure_ascii=False)}\n')
      - name: Verify Aliyun Credentials
        run: |
          echo "验证阿里云凭证环境变量:"
          if [ -n "$ALIBABA_CLOUD_ACCESS_KEY_ID" ]; then
            echo "ALIBABA_CLOUD_ACCESS_KEY_ID: 已设置 (长度: ${#ALIBABA_CLOUD_ACCESS_KEY_ID})"
          else
            echo "ALIBABA_CLOUD_ACCESS_KEY_ID: 未设置"
          fi
          
          if [ -n "$ALIBABA_CLOUD_ACCESS_KEY_SECRET" ]; then
            echo "ALIBABA_CLOUD_ACCESS_KEY_SECRET: 已设置 (长度: ${#ALIBABA_CLOUD_ACCESS_KEY_SECRET})"
          else
            echo "ALIBABA_CLOUD_ACCESS_KEY_SECRET: 未设置"
          fi
      # 7. 更新 plugins.json
      - name: Update plugins.json with aliurl
        if: ${{ steps.process-plugins.outputs.results != '' }}
        shell: python
        env:
          RESULTS_JSON: ${{ steps.process-plugins.outputs.results }}
        run: |
          import json
          import os
          
          with open('plugins.json', 'r', encoding='utf-8') as f:
              plugins = json.load(f)
          
          results = json.loads(os.environ['RESULTS_JSON'])
          updated = False
          
          for result in results:
              if result['status'] != 'success':
                  continue
                  
              for plugin in plugins:
                  if plugin.get('github_url') == result['github_url']:
                      plugin['aliurl'] = result['aliurl']
                      updated = True
                      print(f"Updated {plugin['name']} with aliurl")
                      break
          
          if updated:
              with open('plugins.json', 'w', encoding='utf-8') as f:
                  json.dump(plugins, f, ensure_ascii=False, indent=2)
              print("✅ plugins.json updated with aliurl")
          else:
              print("⚠️ No plugins updated")

      # 8. 提交变更
      - name: Commit and push changes
        if: ${{ success() && steps.process-plugins.outputs.results != '' }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add plugins.json
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add aliurl to plugins.json for Aliyun Codeup sync"
            git push
          fi